<!--
  Excerto de configuracao do agente Wazuh para Windows, laboratorio da
  Nortada Logistica (ver docs/07-integracao-wazuh-sentrylens.md).

  Onde colar: dentro do bloco <ossec_config> do ficheiro ossec.conf do
  agente instalado no controlador de dominio NORTADA-DC01 (por omissao em
  "C:\Program Files (x86)\ossec-agent\ossec.conf"), ao lado dos outros
  blocos <localfile> ja existentes. Nao substituir o ficheiro inteiro, so
  acrescentar o bloco abaixo dentro do <ossec_config> existente.

  Depois de editar, reiniciar o servico do agente para aplicar:
    Restart-Service -Name WazuhSvc

  Porque "eventchannel" e nao "eventlog": o formato "eventchannel" usa a
  API moderna do Windows Event Log (a mesma API usada pelo Event Viewer) e
  preserva os campos estruturados do evento (por exemplo os campos XML de
  TargetUserName, SubjectUserName, MemberName), que as regras em
  wazuh/local_rules.xml dependem para extrair o utilizador afetado e quem
  executou a acao. O formato "eventlog" legado nao expoe esses campos com
  a mesma fiabilidade.
-->
<localfile>
  <location>Security</location>
  <log_format>eventchannel</log_format>
</localfile>
